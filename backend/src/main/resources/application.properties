spring.application.name=pgcar
server.port=8081

# Banco de dados MySQL (o banco "pgcar" é criado automaticamente se não existir).
# Ajuste usuário e senha conforme o MySQL da sua máquina/laboratório.
spring.datasource.url=jdbc:mysql://localhost:3306/pgcar?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cria/atualiza as tabelas automaticamente a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update

# Necessário para carregar os itens de cada pedido ao devolver o JSON
spring.jpa.open-in-view=true
